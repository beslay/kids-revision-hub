"window.print()">打印当前试卷</button></div><div id="result"></div><div class="status" id="sendStatus" role="status" aria-live="polite"></div><div id="quiz"></div><div class="controls"><button onclick="submitResult(this)">提交、评分并发送成绩</button></div><p class="muted">备注：原始成绩页第1题未清楚显示完整正确选项组合，暂按四项皆正确处理，建议对照课本确认。</p></main><script>const ENDPOINT='https://script.google.com/macros/s/AKfycbxlFnyUMLUNHGAwFNIRtQBSsOTCklSTBkJQQx5L40dyeG-3LmnUEuoYuslOqOEtmL92/exec';let submitted=false;const data=[{"q": "以下关于英国干涉马来各邦的背景，哪项叙述是正确的？【可选超过一个答案】", "opts": ["罐头食品工业兴起", "海峡殖民地华欧商人的极力要求", "苏伊士运河的通航使马六甲海峡重要性增加", "工业革命后，欧美各国积极向外寻找原料和市场"], "ans": [0, 1, 2, 3], "multi": true}, {"q": "班上同学们在讨论19世纪中叶雪兰莪接受参政司制度的原因。试问谁的叙述是正确的？", "opts": ["“吉隆坡经重建后，经济发展迅速，引起英国人的觊觎。”", "“英国商船在雪兰莪沿海遭到海盗洗劫，海盗成员有王室成员涉及。”", "“拉惹阿都拉和拉惹马哈地为了巴生河流域的统治权发生内战。”", "“苏丹阿都‧沙末委任来自吉打的东姑古丁掌管雪兰莪。”"], "ans": [1], "multi": false}, {"q": "A酋长和B酋长因锡米税产生冲突；A酋长为了巩固本身的政治和经济地位，于是寻求英国的支持；A酋长在英国人的协助下成功击败对手，英国参政司入驻当地。试问以上是在叙述哪一邦接受参政司制度的背景？", "opts": ["柔佛", "雪兰莪", "霹雳", "森美兰"], "ans": [3], "multi": false}, {"q": "《邦咯协定》的影响有哪些？【可选超过一个答案】", "opts": ["是英国在马来各邦推行参政司制度的开始", "恢复了海峡殖民地与霹雳之间的商业关系", "成功化解了霹雳长期以来的政治内争", "英国的殖民势力终于扩展到马来半岛内陆"], "ans": [0, 1, 2, 3], "multi": true}, {"q": "下列关于马来联邦的叙述，哪一项是错误的？", "opts": ["马来联邦组成后，四邦的行政结构和组织获得统一，提高了行政效率", "马来联邦成立于1896年，俗称“四州府”", "马来联邦的马来统治者的行政权被削弱", "顾问官是马来联邦的最高行政长官"], "ans": [3], "multi": false}, {"q": "18世纪中叶以后，英国东印度公司急于在马六甲海峡寻找新港口的主要军事动机是什么？", "opts": ["建立永久的军事基地，准备全面入侵暹罗领土。", "协助吉打苏丹组建现代海军，以维持该地区的海洋秩序。", "保护在印度东岸的商业利益，对抗法国在孟加拉湾的攻击。", "取代明古连作为对荷兰东印度公司发动进攻的跳板。"], "ans": [2], "multi": false}, {"q": "下图的马来半岛与印尼群岛，在19世纪以前统称为马来群岛或东印度群岛。19世纪以后，哪项条约的签订把它们区隔为两个势力范围？", "opts": ["《曼谷条约》", "《柏尼条约》", "《英荷条约》", "《邦咯协定》"], "ans": [2], "multi": false}, {"q": "马来联邦成立后，引起了马来统治者的不满。试问英殖民政府采取了什么方式安抚马来统治者？（多选题）", "opts": ["所有法令须由统治者签署后才生效", "定期召开统治者会议", "提升马来统治者的行政大权", "委任马来官员出任各级的官职", "马来统治者皆可获得土地和津贴作为补偿"], "ans": [0, 1], "multi": true}, {"q": "小柔参加了学校举办的吉隆坡市区一日游，导游在巴士上向同学们介绍了吉隆坡的开发以及发展，更提到了吉隆坡开埠功臣X的许多伟大事迹。试问导游口中的功臣X指的是下列哪一位人物？", "opts": ["陈亚炎", "郑景贵", "叶亚来", "黄亚福"], "ans": [2], "multi": false}, {"q": "英国已在1786年取得槟榔屿，为什么在若干年后要再占领位于南端的新加坡？\nI. 拿破仑战争后，荷兰重新垄断东南亚的港口，影响英国与中国的贸易\nII. 英国人计划以新加坡作为东印度公司的总部\nIII. 槟榔屿位置偏北，无法跟荷兰人竞争\nIV. 新加坡港口适合停泊军舰", "opts": ["II、III", "I、IV", "I、III", "II、IV"], "ans": [2], "multi": false}];data[6].image_path='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfEAAAGuCAIAAAAPiKgIAAAACXBIWXMAAA7EAAAOxAGVKw4bAAHFx0lEQVR4nOy9BXhVV9r+/b7XvPOfaWc67aSdlhq0pZQChbZQXIOG4u5WoLi7Fy8WvEhwC27B3d3dIRQpXqEUiJzvx3nmrG9l731ODkkITGbd175y7eyzda1n3c/9LP0fl4GBgYFBUsH/PO8XMDAwMDBIMBhONzAwMEg6MJxuYGBgkHRgON3AwMAg6cBwuoGBgUHSgeF0AwMDg6QDw+lWLD21YdePhywH9149uu78jsR8DZ44bNe0W7/fjcO1vz68z7XcIQ7XPox4NGZv6Nbw/XG4Ngng3J3L0dHR6t9fHv624uyWn//41cclzyvFLt27uv3ygT8iHibycy3Y+eOhWUeWqX8joiIu3ruCBXo7/8ovP928fydRXi0GHkdGbLiwiwx1/PXB4z9C9s+7/tstb5eT1Ddsr80915zbfuSn0/68AHal7o/NbLy429vLeMNvj36fcnDRqVsXfJ+WdDh9/7VjLVf1e6pt+uEl9vt8MjKo4ryWloO1FnX8cmwZH08/f/fypou7Y91O3jrv5+cM3Tk1YEDW4zfPxnrm6dsXy8xuqvuhH3+5zrXcQT/tmyWdO6wdHBUd5ftui06u5dpJBxf4+Z5g7vGVaUcVO3sn3P9LdFDIR+6eQfJOPriQfx9FPr73xy/2jWKgX4Vl47f82ZacWq9fuC18v/0cSJmfwn++9vqAbLOPrVAnU4RIjdO3fZWiOKRYgqD/1vE898ydS4n83JwTq2JL6t82qwekGJpf/Su2N/HAfG+XNwjrnmxwLqF1cQCO29Vfb8Th3eYdX0W5tpiKgBL64bCCpUIbQ8T2X0fsns5rhx5d7nhb3jP9DyWzT6hsP/7F2NJFptfz8UrIsmWnN3ZcN4QzkwcHIhpcbg/B41af2+b7c+4/etBuzSCMUP6NNW0FLxCn40VJ9KfdsDC5nOzkg/k3cEpNf7a3BuWsv7Sb5R1IcW4y//hq/SAsg9U2X9nXx8v33DSKC2Pdys1p7mdq+M/pvB7WljWkIjtyxM7pB66f4Ejj5b3sl+MSvts4Um3c542B2TutC9YPsvlQ/a1Xff/ukDzYt5+fBnAtR2+cGbR9YvFZDaFR3q3w9LpTDy1Gy0g+2jeLKctpyYcG+jYPvqXSvFb6hZRe/Acbl388ojA7Hw0vpFiJJMoyvoJ4Pl4m7+Qa1Ra0TfAUiz94Q96cRz+7R3gD7KYn6VNxOsT6r4E5mq7orZ/suKlyrVBhbss6i//tS/h8lAS61XIODoNrvb05ITi/YnWW4whwbKDsnGZ6iKYDN+/NbY/fN4efHPN6wYk1mceXl8/BUFus7Lv+wk4pJsN3TcPsfcd/Ajgd65JKgsTm9PCfr/baNCoyKjLOd4C/HNV0gal1+BKUsuOvkKlcLoWcz9bv2Xn90LXntzs+DtPUOZ2nH7x+stfmH94enJtwkn02MRqibzEFi+i+/fs9dbk/Oh2Kqbe0q/1NKCH++AO1UYosd5A3nODJbDunl5/bAtp1DC0RC5ycbnRxYTr7RkJxghILdhSYWhsBUntxJ98bVKgukTdMPTKI49joT7/dVj9JPkKRSkSLv3Tk9Fh9HtRg4XQBsTaXS6BGQilW2n
