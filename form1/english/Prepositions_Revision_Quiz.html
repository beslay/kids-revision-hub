<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prepositions Revision Quiz</title><style>:root{font-family:system-ui,'Segoe UI',sans-serif;color:#23324b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:25px 16px 60px}h1{margin-bottom:5px}p{line-height:1.55}.muted{color:#617089}.panel{background:white;border:1px solid #dce4ef;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 3px 12px #22334408}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,select{font:inherit;border-radius:9px;padding:10px 14px;border:1px solid #bccbe0;background:white;color:#243650}button{cursor:pointer}button.primary{background:#245bd6;color:white;border-color:#245bd6}button:disabled{opacity:.55;cursor:not-allowed}.question{padding:15px 0;border-bottom:1px solid #e7edf5}.question:last-child{border:0}.qtitle{font-weight:650;margin-bottom:9px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{padding:8px 13px}.choice.selected{background:#dce8ff;border-color:#245bd6}.choice.correct{background:#def6e6;border-color:#278348}.choice.wrong{background:#ffe1df;border-color:#cf4a43}.feedback{margin-top:8px;font-size:.92rem;color:#40516b}.score{font-size:1.4rem;font-weight:700}.pill{display:inline-block;padding:5px 10px;border-radius:30px;background:#e8efff;color:#2857ad;font-size:.82rem}.hidden{display:none}details{margin-top:10px}summary{cursor:pointer;font-weight:600}.answerrow{padding:6px 0;border-bottom:1px solid #edf0f5;font-size:.94rem}#sticky{position:sticky;bottom:0;background:#f3f6fbef;padding:12px 0;border-top:1px solid #dce4ef}</style></head><body><main class="wrap"><h1>Prepositions Revision Quiz</h1><p class="muted">Practice place, time, direction and other prepositions. Questions and choices shuffle whenever you restart.</p><section class="panel"><div class="controls"><label for="section">Exercise:</label><select id="section"><option value="all">All questions</option><option value="original">Worksheet questions (35)</option><option value="notes">Extra practice from notes</option><option value="place">Place</option><option value="time">Time</option><option value="direction">Direction</option><option value="other">Other</option></select><button class="primary" id="restart">Start / Shuffle</button><span id="count" class="pill"></span></div><p class="muted" style="margin-bottom:0">Choose one answer for each question. Click <b>Check answers</b> to see your score and corrections.</p></section><div id="quiz"></div><div id="sticky"><div class="controls"><button class="primary" id="check">Check answers</button><button id="retry">Try again (shuffle)</button><span id="progress" class="muted"></span></div></div><section id="result" class="panel hidden" aria-live="polite"></section><section class="panel"><details><summary>View correct answers to the original worksheet</summary><div id="answerkey"></div></details></section></main><script>
const raw=[
['original','other','The fans are waiting ___ the building.','outside','The fans are outside the building.'],
['original','place','The Saja Boys were sleeping ___ the sleeping bags.','in','We sleep in sleeping bags.'],
['original','place','The man with black hair is sitting ___ the woman with purple hair.','beside','Beside means next to.'],
['original','other','He is whispering ___ her ear.','in','The usual expression is whispering in her ear.'],
['original','other','The pretty woman is sitting ___ the two handsome men.','between','Between is used for two people.'],
['original','place','The keys are ___ my bag.','in','Inside a bag: in.'],
['original','place','The children are playing ___ the playground.','at|in','Both at the playground and in the playground can be correct.'],
['original','place','The cat is hiding ___ the sofa.','behind','Behind means at the back of something.'],
['original','place','The books are ___ the shelf.','on','Books are on the shelf.'],
['original','place','The car is parked ___ the building.','outside|near|beside','Without a picture, outside, near and beside can all work.'],
['original','place','The hospital is ___ the school and the post office.','between','Between connects two places.'],
['original','place','The bird is sitting ___ the branch.','on','A bird sits on a branch.'],
['original','place','The dog is lying ___ the table.','below|under','Under and below both indicate a lower position.'],
['original','place','There is a small park ___ my house.','near|beside','Near and beside are both possible.'],
['original','place','The shoes are ___ the door, not inside.','outside','The contrast with not inside suggests outside.'],
['original','time','I was born ___ 2010.','in','Use in with years.'],
['original','time','The train leaves ___ 6:00 p.m.','at','Use at with clock times.'],
['original','time','She always takes a nap ___ the afternoon.','in','In the afternoon.'],
['original','time','We went to the cinema ___ lunch.','after|before','Both before lunch and after lunch are grammatical; no further context is given.'],
['original','time','He has lived here ___ five years.','for','For describes a duration.'],
['original','time','They have been friends ___ kindergarten.','since','Since identifies the starting point.'],
['original','time','Please finish your homework ___ tomorrow.','by|before','By tomorrow means no later than tomorrow; before tomorrow is also possible.'],
['original','time','He usually gets up ___ 7 a.m.','at','Use at with specific clock times.'],
['original','time','I met him just ___ the meeting.','before|after','Both before and after work without further context.'],
['original','time','You can stay here ___ I return.','until','Until indicates the endpoint.'],
['original','direction','She walked ___ the door and entered the classroom.','towards','Towards means in the direction of.'],
['original','direction','The dog jumped ___ the sofa and lay down.','onto','Onto indicates movement to a surface.'],
['original','direction','He ran ___ the stairs to catch the train.','up','Up the stairs indicates upward movement.'],
['original','direction','They walked ___ the river to enjoy the view.','along','Along means following the length of the river.'],
['original','direction','We looked as the bird flew ___ the sky and disappeared.','into','Into the sky indicates movement into an area.'],
['original','direction','The boy came ___ the house, holding a box.','out of|from','Both came out of the house and came from the house are possible.'],
['original','direction','I saw her walking quickly ___ the bus stop.','towards','Towards means in the direction of the bus stop.'],
['original','direction','The car drove ___ the tunnel and emerged on the other side.','through','Through means entering and exiting.'],
['original','direction','He turned ___ the corner and found the shop.','around','Turned around the corner is the intended expression.'],
['original','direction','The children slid ___ the slide one by one.','down','Down shows movement from top to bottom.'],
['notes','place','My aunt lives ___ Malaysia.','in','Use in with countries.'],
['notes','place','They live ___ Kuala Lumpur.','in','Use in with cities.'],
['notes','place','The café is ___ Jalan Ampang.','on','Use on with street names.'],
['notes','place','We will meet ___ 25 Jalan Merdeka.','at','Use at with specific addresses.'],
['notes','place','She is ___ the classroom.','in','Use in for enclosed spaces.'],
['notes','place','The picture is ___ the wall.','on','On indicates a surface.'],
['notes','place','I am waiting ___ the entrance.','at','At identifies a specific point.'],
['notes','time','My birthday is ___ October.','in','Use in with months.'],
['notes','time','We travel ___ December.','in','Use in with months.'],
['notes','time','School starts ___ Monday.','on','Use on with days.'],
['notes','time','The test is ___ 13 October.','on','Use on with dates.'],
['notes','time','We go swimming ___ the summer.','in','Use in with seasons.'],
['notes','time','I will call you ___ night.','at','At night is the standard expression.'],
['notes','time','The lesson starts ___ noon.','at','At noon.'],
['notes','time','We exchanged gifts ___ Christmas Day.','on','Use on for the named day, Christmas Day.'],
['notes','time','Many families travel ___ the school holidays.','during','During describes a period when something happens.'],
['notes','direction','The child ran ___ the classroom.','into','Into means entering.'],
['notes','direction','The cat came ___ the box.','out of','Out of means moving from inside to outside.'],
['notes','direction','The train went ___ the tunnel.','through','Through means passing from one side to the other.'],
['notes','direction','She walked ___ the road to the other side.','across','Across means from one side to another.'],
['notes','direction','The hikers walked ___ the path.','along','Along means following a route.'],
['notes','direction','The ball rolled ___ the hill.','down','Down indicates descending movement.'],
['notes','other','I went shopping ___ my sister.','with','With indicates company.'],
['notes','other','She cut the paper ___ scissors.','with','With indicates the tool used.'],
['notes','other','This present is ___ you.','for','For can indicate the recipient.'],
['notes','other','I have been studying ___ two hours.','for','For indicates a duration.'],
['notes','other','The table is made ___ wood.','of','Made of is used when the material remains identifiable.']
];
const pool=['in','on','at','outside','inside','beside','between','near','behind','below','under','with','for','by','before','after','during','since','until','from','towards','into','out of','across','through','along','around','onto','up','down','of'];let active=[],answers={},checked=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function optionsFor(item){const correct=item[3].split('|');const choices=shuffle([...new Set([...correct,...shuffle(pool.filter(x=>!correct.includes(x))).slice(0,Math.max(0,4-correct.length))])]);return choices}
function start(){let section=document.getElementById('section').value;active=shuffle(raw.map((r,i)=>({r,i})).filter(x=>section==='all'||(section==='original'?x.r[0]==='original':section==='notes'?x.r[0]==='notes':x.r[1]===section)));answers={};checked=false;document.getElementById('result').classList.add('hidden');document.getElementById('count').textContent=active.length+' questions';document.getElementById('quiz').innerHTML=active.map((x,k)=>`<section class="panel question" id="q${k}"><div class="qtitle">${k+1}. ${x.r[2].replace('___','<u>________</u>')}</div><div class="choices">${optionsFor(x.r).map(o=>`<button class="choice" data-i="${k}" data-a="${o}" type="button">${o}</button>`).join('')}</div><div class="feedback" id="f${k}"></div></section>`).join('');document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(checked)return;let i=+b.dataset.i;answers[i]=b.dataset.a;document.querySelectorAll(`[data-i="${i}"]`).forEach(z=>z.classList.toggle('selected',z===b));progress()}));progress();window.scrollTo({top:0,behavior:'smooth'})}
function progress(){document.getElementById('progress').textContent=`${Object.keys(answers).length} / ${active.length} answered`}
function check(){if(checked)return;checked=true;let score=0;active.forEach((x,k)=>{let accepted=x.r[3].split('|'),ans=answers[k],good=accepted.includes(ans);if(good)score++;document.querySelectorAll(`[data-i="${k}"]`).forEach(b=>{b.disabled=true;b.classList.remove('selected');if(accepted.includes(b.dataset.a))b.classList.add('correct');else if(b.dataset.a===ans)b.classList.add('wrong')});document.getElementById('f'+k).innerHTML=`${good?'✓ Correct':'✗ '+(ans?'Your answer: '+ans:'Not answered')}. <b>Accepted: ${accepted.join(' / ')}</b>. ${x.r[4]}`});let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<div class="score">Your score: ${score} / ${active.length} (${Math.round(score/active.length*100)}%)</div><p>${score===active.length?'Excellent! All correct.':'Review the highlighted corrections, then try again to improve your score.'}</p>`;r.scrollIntoView({behavior:'smooth',block:'start'})}
document.getElementById('answerkey').innerHTML=raw.filter(x=>x[0]==='original').map((r,i)=>`<div class="answerrow">${i+1}. ${r[2].replace('___','<b>'+r[3].split('|').join(' / ')+'</b>')}</div>`).join('');document.getElementById('restart').onclick=start;document.getElementById('retry').onclick=start;document.getElementById('check').onclick=check;document.getElementById('section').onchange=start;start();
</script></body></html>
